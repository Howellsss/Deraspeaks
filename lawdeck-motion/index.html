<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lawdeck Brand Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0c;
    --paper: #f5f4f0;
    --text: #f3f1ec;
    --mute: rgba(243, 241, 236, 0.56);
    --u: 1vw;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: var(--text); }

  /* 16:9 stage, letterboxed. --u = 1% of stage width, so the film scales as one piece. */
  #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: var(--ink); overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #grain { width: 100%; height: 100%; opacity: 0.045; mix-blend-mode: screen; image-rendering: pixelated; }

  /* Kinetic type */
  .txt { position: absolute; will-change: transform, opacity; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .center { left: 0; right: 0; text-align: center; }
  .serif { font-family: Newsreader, Georgia, serif; }
  .hero, .big, .head, .pillars { text-shadow: 0 0 calc(var(--u) * 2.5) rgba(0,0,0,0.9), 0 0 calc(var(--u) * 0.8) rgba(0,0,0,0.7); }
  .hero { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 4); font-weight: 400; letter-spacing: -0.02em; line-height: 1.12; }
  .big { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 6); font-weight: 400; letter-spacing: -0.03em; }
  .punch { text-shadow: 0 0 calc(var(--u) * 3) rgba(0,0,0,0.85), 0 0 calc(var(--u) * 1) rgba(0,0,0,0.6); font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 11); font-weight: 400; letter-spacing: -0.045em; line-height: 1; transform-origin: 50% 50%; }
  .meet { font-size: calc(var(--u) * 7); }
  #flash { background: #fff; opacity: 0; }
  .col { left: 6%; width: 28%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); }
  .col > .txt { position: relative; }
  .eyebrow { font-size: calc(var(--u) * 0.85); font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--mute); }
  .head { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 3.5); font-weight: 400; letter-spacing: -0.025em; line-height: 1.05; }
  .body { font-size: calc(var(--u) * 1.15); font-weight: 400; line-height: 1.55; color: var(--mute); }
  .pillar { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 1.8); font-weight: 400; letter-spacing: -0.01em; text-align: center; width: 24%; }
  .pillar small { font-family: Inter, system-ui, sans-serif; display: block; margin-top: calc(var(--u) * 0.5); font-size: calc(var(--u) * 0.95); font-weight: 400; color: var(--mute); line-height: 1.5; }

  /* End card */
  #end { background: var(--paper); opacity: 0; display: grid; place-items: center; }
  #endInner { display: flex; flex-direction: column; align-items: center; }
  #endMark { width: calc(var(--u) * 13); }
  #endWord { width: calc(var(--u) * 26); margin-top: calc(var(--u) * 2.2); }
  #endTag { margin-top: calc(var(--u) * 1.6); text-align: center; color: #0e0e0f; }
  .endSub { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 2.3); letter-spacing: -0.01em; }
  .endPillars { margin-top: calc(var(--u) * 1.2); font-size: calc(var(--u) * 0.95); font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #55534f; }
  .sub { font-size: calc(var(--u) * 2.3); color: var(--mute); }
  .pillars { left: 0; right: 0; top: 47%; display: flex; justify-content: center; gap: calc(var(--u) * 3.4); }
  .pitem { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.8); }
  .pitem > .txt { position: relative; }
  .pword { font-family: Newsreader, Georgia, serif; font-size: calc(var(--u) * 3.6); letter-spacing: -0.025em; }

  /* Preview controls (hidden while rendering) */
  #ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
        padding: 8px 14px; border-radius: 999px; background: rgba(20,20,22,0.72); backdrop-filter: blur(10px);
        color: #ddd; font: 500 12px Inter, system-ui, sans-serif; transition: opacity .4s; z-index: 5; }
  #ui button { all: unset; cursor: pointer; width: 22px; text-align: center; font-size: 14px; }
  #ui input { width: min(46vw, 420px); accent-color: #f3f1ec; }
  #ui span { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
  body.idle #ui { opacity: 0; }
  body.render #ui { display: none; }
  @media (max-width: 600px) { #ui input { width: 40vw; } }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="layer" id="type"></div>
  <div class="layer" id="end">
    <div id="endInner">
      <img id="endMark" src="assets/mark.png" alt="Lawdeck mark">
      <img id="endWord" src="assets/wordmark-ink.png" alt="Lawdeck">
      <div id="endTag"><div class="endSub">Your AI law school study companion.</div><div class="endPillars">Research&nbsp;&nbsp;·&nbsp;&nbsp;Learn&nbsp;&nbsp;·&nbsp;&nbsp;Draft&nbsp;&nbsp;·&nbsp;&nbsp;Remember&nbsp;&nbsp;·&nbsp;&nbsp;Communicate</div></div>
    </div>
  </div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="vignette"></div>
  <canvas class="layer" id="grain" width="960" height="540"></canvas>
</div>
<div id="ui">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <input id="scrub" type="range" min="0" max="98" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0s</span>
</div>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------
   CONFIG
   Real screen recordings replace the coded interface mockups.
   Set a path here, or pass it in the URL: ?research=clips/research.mp4
   ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const CLIPS = {
  research: params.get('research') || '',
  learn:    params.get('learn')    || '',
  remember: params.get('remember') || '',
  draft:    params.get('draft')    || '',
  chat:     params.get('chat')     || '',
};
const RENDER = params.has('render');
const DUR = 98;
if (RENDER) document.body.classList.add('render');

/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const io = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // cubic in-out
const eo = x => 1 - Math.pow(1 - x, 3);                                       // cubic out
const ex = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x);                        // expo out
const rand = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(1337);

const stage = document.getElementById('stage');
const typeLayer = document.getElementById('type');
const endEl = document.getElementById('end');
const vignette = document.getElementById('vignette');

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RENDER });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0x0b0b0c, 9, 24);
const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.05, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xfff6ea, 2.2); key.position.set(2.5, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe6ff, 0.9); rim.position.set(-4, 1, -3); scene.add(rim);
const spot = new THREE.SpotLight(0xffffff, 0, 14, 0.38, 0.9, 1.2); spot.position.set(0, 4.5, 4); scene.add(spot); scene.add(spot.target);

function resize() {
  const r = stage.getBoundingClientRect();
  stage.style.setProperty('--u', (r.width / 100) + 'px');
  renderer.setPixelRatio(RENDER ? 1 : Math.min(devicePixelRatio, 2));
  renderer.setSize(r.width, r.height, false);
}
addEventListener('resize', resize); resize();

/* ---------------- assets ---------------- */
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const fontsReady = Promise.all([...['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 20px Inter`)), document.fonts.load('400 20px Newsreader'), document.fonts.load('500 20px Newsreader')]).catch(() => {});
const [markImg, wordImg, wordInk] = await Promise.all([loadImg('assets/mark.png'), loadImg('assets/wordmark.png'), loadImg('assets/wordmark-ink.png'), fontsReady, ...[...document.images].map(i => i.decode().catch(() => {}))]);

const markInv = (() => { const c = document.createElement('canvas'); c.width = markImg.width; c.height = markImg.height; const g = c.getContext('2d'); g.filter = 'invert(1)'; g.drawImage(markImg, 0, 0); return c; })();

/* ---------------- paper ---------------- */
function paperTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 664;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f2ed'; g.fillRect(0, 0, 512, 664);
  const r = (s => () => (s = (s * 48271) % 2147483647) / 2147483647)(7);
  g.fillStyle = 'rgba(20,20,20,0.75)'; g.fillRect(64, 70, 210, 16);
  g.fillStyle = 'rgba(20,20,20,0.18)';
  let y = 120;
  while (y < 600) {
    const lines = 3 + Math.floor(r() * 4);
    for (let i = 0; i < lines && y < 600; i++, y += 22) g.fillRect(64, y, (i === lines - 1 ? 0.45 + r() * 0.35 : 0.92 + r() * 0.08) * 384, 7);
    y += 18;
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const PAPER = paperTexture();
function pageGeometry() {
  const g = new THREE.PlaneGeometry(0.85, 1.1, 24, 24);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, 0.045 * Math.sin((x / 0.85 + 0.5) * Math.PI) + 0.02 * (y / 1.1)); }
  g.computeVertexNormals(); return g;
}
const PAGE_GEO = pageGeometry();

const hero = new THREE.Mesh(PAGE_GEO, new THREE.MeshStandardMaterial({ map: PAPER, roughness: 0.62, metalness: 0, side: THREE.DoubleSide }));
scene.add(hero);

/* The swarm: pages that swirl, become "one deck", then become a quiet depth field. */
const N = 150;
const pageMat = new THREE.MeshStandardMaterial({ map: PAPER, roughness: 0.65, side: THREE.DoubleSide });
const pages = new THREE.InstancedMesh(PAGE_GEO, pageMat, N);
pages.frustumCulled = false; scene.add(pages);
const seeds = Array.from({ length: N }, (_, i) => ({
  a: rand() * Math.PI * 2, sp: 0.12 + rand() * 0.2, rad: 1.7 + rand() * 4.6, y: (rand() - 0.5) * 5.5, z: -9 + rand() * 10.5,
  r1: rand() * 2 - 1, r2: rand() * 2 - 1, r3: rand() * 2 - 1, d: rand(),
  fx: (rand() - 0.5) * 20, fy: (rand() - 0.5) * 11, fz: -15 + rand() * 7, ord: i,
}));
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), P = new THREE.Vector3(), S = new THREE.Vector3();
const vA = new THREE.Vector3(), vB = new THREE.Vector3();

/* ---------------- timeline (set by the voice-over) ---------------- */
const L1 = 1.2, L2 = 4.6, L2b = 7.9, MEET = 12.4, FIVE = 16.6;
const PILL = [18.9, 20.0, 21.1, 22.2, 23.3];        // Research. Learn. Draft. Remember. Communicate.
const BAR = 2.125;                                  // ~113 bpm
const SC0 = 25.5;                                   // the beat drops into the five pillar scenes
const LENS = [4, 4, 4, 6, 4].map(b => b * BAR);
const STARTS = LENS.map((_, i) => SC0 + LENS.slice(0, i).reduce((a, b) => a + b, 0));
const FT0 = STARTS[4] + LENS[4];                    // 72.25  everything else
const TR = FT0 + 3 * BAR;                           // 78.6   trust
const DAY = TR + 6.0;                               // 84.6   "From day one, to exam day."
const TE = DAY + 2.4;                               // 87.0   pages gather, a page comes to camera
const LOGO = TE + 3.0;                              // 90.0   the logo lands

/* The Lawdeck mark: the deck collapses into it on "Meet Lawdeck", then it releases the pages */
const markTex = new THREE.CanvasTexture(markInv); markTex.colorSpace = THREE.SRGBColorSpace; markTex.anisotropy = 8;
const markMat = new THREE.MeshBasicMaterial({ map: markTex, transparent: true, toneMapped: false, opacity: 0 });
const markMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2 * markImg.height / markImg.width), markMat);
markMesh.position.set(0, 0.32, -0.2); scene.add(markMesh);
function markState(t) {
  const k = ex(seg(t, MEET - 0.08, MEET + 0.8)), out = io(seg(t, FIVE - 0.9, FIVE - 0.1));
  markMat.opacity = Math.min(1, k * 1.4) * (1 - out);
  markMesh.visible = markMat.opacity > 0.001;
  markMesh.scale.setScalar(lerp(0.55, 1, k) * (1 + out * 0.25) * (1 + 0.012 * Math.sin(t * 2)));
  markMesh.rotation.set(lerp(0.25, 0, k) + Math.sin(t * 0.7) * 0.03, lerp(-0.6, 0, k) + Math.sin(t * 0.5) * 0.05, 0);
}

function heroState(t) {
  if (t < 8) {
    const k = eo(seg(t, 0, 4.6)), away = io(seg(t, 4.4, 7.2));
    hero.visible = true;
    hero.position.set(lerp(0.5, 0, k), lerp(-2.4, 0.38, k) + Math.sin(t * 0.6) * 0.03 + away * 0.6, lerp(-3, 0.4, k) - away * 3.5);
    hero.rotation.set(lerp(0.55, 0.06, k) + Math.sin(t * 0.5) * 0.02, lerp(-0.95, -0.18, k) + away * 1.4, lerp(0.22, -0.04, k));
    hero.scale.setScalar(1 - io(seg(t, 6.4, 7.8)));
  } else if (t > TE + 0.6) {
    const k = io(seg(t, TE + 0.8, TE + 3.0));
    hero.visible = true; hero.scale.setScalar(1);
    hero.position.set(lerp(0.3, 0, k), lerp(-0.2, 0, k), lerp(-7, 5.75, k));
    hero.rotation.set(lerp(-0.35, 0, k), lerp(0.9, 0, k), lerp(-0.25, 0, k));
  } else hero.visible = false;
}

function pagesState(t) {
  const emerge = io(seg(t, 4.4, 6.8));
  const dim = seg(t, 16.0, 18.0) * (1 - seg(t, TE, TE + 0.8));
  pageMat.color.setScalar(lerp(1, 0.1, dim) * (1 - 0.45 * seg(t, 4.6, 6.0) * (1 - seg(t, 10.6, 12.2))));
  pages.visible = t > 4.3 && t < TE + 1.9;
  if (!pages.visible) return;
  const collapse = io(seg(t, MEET - 0.4, MEET));
  for (let i = 0; i < N; i++) {
    const s = seeds[i];
    const a = s.a + t * s.sp;
    vA.set(Math.cos(a) * s.rad, s.y + Math.sin(t * 0.3 + s.d * 6) * 0.25, s.z + Math.sin(a) * 1.2);
    E.set(t * 0.35 * s.r1 + s.r2, t * 0.3 * s.r2 + a, t * 0.2 * s.r3);
    const st = io(seg(t, 10.4 + s.d * 0.5, 12.1 + s.d * 0.5));
    vB.set(s.ord * 0.0016 - 0.12, 0.25 + s.r1 * 0.004, -0.4 - s.ord * 0.014);
    P.copy(hero.position).lerp(vA, emerge).lerp(vB, st);
    let rx = lerp(E.x, 0.06 + s.r1 * 0.01, st), ry = lerp(E.y, -0.18 + s.r2 * 0.015 + Math.sin(t * 0.6) * 0.04 * st, st), rz = lerp(E.z, s.r3 * 0.03, st);
    const ft = t * 0.05, sc = io(seg(t, 15.8 + s.d * 0.9, 17.8 + s.d * 0.9));
    P.set(lerp(P.x, s.fx + Math.sin(ft + s.d * 9) * 0.6, sc), lerp(P.y, s.fy + Math.cos(ft * 1.3 + s.d * 7) * 0.4, sc), lerp(P.z, s.fz, sc));
    rx = lerp(rx, s.r1 * 0.8 + Math.sin(ft + s.d) * 0.3, sc); ry = lerp(ry, s.r2 * 1.2 + ft, sc); rz = lerp(rz, s.r3 * 0.6, sc);
    const g = io(seg(t, TE + s.d * 0.6, TE + 1.2 + s.d * 0.6));
    P.set(lerp(P.x, 0, g), lerp(P.y, 0, g), lerp(P.z, -6.5, g)); rx = lerp(rx, 0, g); ry = lerp(ry, 0, g); rz = lerp(rz, 0, g);
    const back = io(seg(t, 15.8 + s.d * 0.9, 16.8 + s.d * 0.9));
    const scale = emerge * (1 - g * 0.85) * ((1 - collapse) + collapse * back);
    E.set(rx, ry, rz); Q.setFromEuler(E); S.setScalar(Math.max(scale, 0.0001));
    M.compose(P, Q, S); pages.setMatrixAt(i, M);
  }
  pages.instanceMatrix.needsUpdate = true;
}

/* ---------------- interface panels ----------------
   Recreated from the Lawdeck app: warm paper UI, serif headings, Inter UI text.
   The window is 1600 x 920 (the app's own proportions, slightly enlarged type for legibility on video). */
const W = 1600, H = 920, SW = 252, MCX = SW + (W - SW) / 2;
const LIGHT = { side: '#f4f2f0', bg: '#fbf9f7', card: '#ffffff', line: '#e6e3de', ink: '#161714', mute: '#7d7d7b', faint: '#b9b8b4', chip: '#efede9', btn: '#161714', btnText: '#ffffff', soft: '#f5f3ef' };
const DARK  = { side: '#141414', bg: '#1a1a1a', card: '#252623', line: '#34342f', ink: '#edebe7', mute: '#91908b', faint: '#5e5d59', chip: '#2c2c29', btn: '#f1efeb', btnText: '#161714', soft: '#222220' };
let C = LIGHT;
const F  = (s, w = 400) => `${w} ${s}px Inter, system-ui, sans-serif`;
const FS = (s, w = 400) => `${w} ${s}px Newsreader, Georgia, serif`;

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(c, s, x, y, size, w = 400, col = C.ink, ls = 0, align = 'left', serif = false) {
  c.font = serif ? FS(size, w) : F(size, w); c.fillStyle = col; c.letterSpacing = ls + 'px'; c.textAlign = align; c.fillText(s, x, y); c.letterSpacing = '0px'; c.textAlign = 'left';
}
const stxt = (c, s, x, y, size, col = C.ink, align = 'left') => txt(c, s, x, y, size, 400, col, -0.3, align, true);
function measure(c, s, size, w = 400, serif = false, ls = 0) { c.font = serif ? FS(size, w) : F(size, w); c.letterSpacing = ls + 'px'; const m = c.measureText(s).width; c.letterSpacing = '0px'; return m; }
/* Wrapped text, revealed character by character. [Bracketed] words are drawn as fill-in fields. */
function para(c, s, x, y, maxW, size, lh, w = 400, col = C.ink, reveal = 1, serif = false) {
  c.font = serif ? FS(size, w) : F(size, w);
  const words = s.split(' ');
  let n = Math.floor(s.length * reveal), cx = x, cy = y, used = 0;
  const space = c.measureText(' ').width;
  for (const wd of words) {
    if (used >= n) break;
    const ww = c.measureText(wd).width;
    if (cx + ww > x + maxW && cx > x) { cx = x; cy += lh; }
    const vis = wd.slice(0, Math.max(0, n - used));
    if (wd.startsWith('[') || /\[/.test(wd)) {
      c.fillStyle = C.chip; rr(c, cx - 3, cy - size * 0.9, c.measureText(vis).width + 6, size * 1.28, 4); c.fill(); c.fillStyle = C.mute;
    } else c.fillStyle = col;
    c.fillText(vis, cx, cy);
    used += wd.length + 1; cx += ww + space;
  }
  return { y: cy, x: cx };
}
function caret(c, x, y, size, t) { if (Math.floor(t * 2.2) % 2 === 0) { c.fillStyle = C.ink; c.fillRect(x + 2, y - size * 0.85, 2, size * 1.05); } }
function card(c, x, y, w, h, r = 18, fill = C.card) {
  c.save(); c.shadowColor = C === DARK ? 'rgba(0,0,0,0.3)' : 'rgba(40,30,20,0.06)'; c.shadowBlur = 22; c.shadowOffsetY = 5; rr(c, x, y, w, h, r); c.fillStyle = fill; c.fill(); c.restore();
  rr(c, x, y, w, h, r); c.strokeStyle = C.line; c.lineWidth = 1.5; c.stroke();
}
function chip(c, s, x, y, size = 14, fill = C.chip, col = C.ink, w = 500, h = null) {
  const tw = measure(c, s, size, w), hh = h || size + 18; rr(c, x, y, tw + 26, hh, hh / 2); c.fillStyle = fill; c.fill();
  txt(c, s, x + 13, y + hh / 2 + size * 0.36, size, w, col); return tw + 26;
}
function outline(c, s, x, y, h, icon, size = 15) {

T('From your very first lecture<br>to your final exam.', L2b, MEET - 0.9, 'center hero', 'top:69%', 0.08);
T('Meet Lawdeck.', MEET, FIVE - 0.5, 'center punch meet', 'top:60%', 0, typeLayer, true);
T('Your AI law school study companion.', MEET + 1.3, FIVE - 0.5, 'center hero sub', 'top:77%', 0.06);
T('Built on five pillars.', FIVE, SC0 - 0.6, 'center hero', 'top:30%', 0.08);
const row = document.createElement('div'); row.className = 'txt pillars'; typeLayer.appendChild(row);
['Research', 'Learn', 'Draft', 'Remember', 'Communicate'].forEach((w, k) => {
  const item = document.createElement('div'); item.className = 'pitem'; row.appendChild(item);
  T('0' + (k + 1), PILL[k] - 0.1, SC0 - 0.6, 'eyebrow', '', 0, item);
  T(w + '.', PILL[k], SC0 - 0.6, 'pword', '', 0, item);
});
// The five pillar scenes
PANELS.forEach(P_ => {
  T(P_.word, P_.t0 - 0.05, P_.t0 + 0.8, 'center punch', 'top:38%', 0, typeLayer, true);
  const col = document.createElement('div'); col.className = 'txt col'; typeLayer.appendChild(col);
  T(`${P_.n}&nbsp;&nbsp;/&nbsp;&nbsp;${P_.label}`, P_.t0 + 1.0, P_.t0 + 4.4, 'eyebrow', '', 0.03, col);
  T(P_.head, P_.t0 + 1.15, P_.t0 + 4.4, 'head', '', 0.07, col);
});
// Everything else
T('Everything else, in one place.', FT0 + 0.2, FT1 - 0.4, 'center hero', 'top:8.5%', 0.05);
// Trust, one line at a time
T('Every answer, cited.', TR + 0.3, TR + 2.0, 'center big', 'top:40%', 0.08);
T('Your work, private.', TR + 2.0, TR + 3.6, 'center big', 'top:40%', 0.08);
T('You, in control.', TR + 3.6, DAY - 0.1, 'center big', 'top:40%', 0.08);
T('From day one,<br>to exam day.', DAY, TE + 0.5, 'center big', 'top:33%', 0.1);

/* ---------------- end card ---------------- */
const endMark = document.getElementById('endMark'), endWord = document.getElementById('endWord'), endTag = document.getElementById('endTag');
function endState(t) {
  const on = seg(t, LOGO - 0.4, LOGO - 0.05);
  endEl.style.opacity = on.toFixed(3);
  vignette.style.opacity = (1 - on * 0.85).toFixed(3);
  const m = ex(seg(t, LOGO, LOGO + 0.9)), w = io(seg(t, LOGO + 0.6, LOGO + 1.5)), g = eo(seg(t, LOGO + 1.6, LOGO + 2.4));
  endMark.style.opacity = eo(seg(t, LOGO, LOGO + 0.35)); endMark.style.transform = `scale(${lerp(1.25, 1, m)})`;
  endWord.style.clipPath = `inset(0 ${(100 - w * 100).toFixed(2)}% 0 0)`;
  endWord.style.opacity = w > 0 ? 1 : 0;
  endTag.style.opacity = g; endTag.style.transform = `translateY(${(1 - g) * 10}px)`;
  document.getElementById('endInner').style.opacity = 1 - seg(t, DUR - 1.2, DUR);
}

/* ---------------- flashes, shake, motion blur ---------------- */
const flashEl = document.getElementById('flash');
const FLASHES = [[MEET, 0.3], ...PANELS.map(p => [p.t0, 0.08])];
const impact = (t, list) => list.reduce((a, [h, s]) => a + (t >= h ? s * Math.exp(-(t - h) * 10) : 0), 0);
function fxState(t) {
  flashEl.style.opacity = Math.min(1, impact(t, FLASHES)).toFixed(3);
  let b = 0;
  PANELS.forEach(P_ => {
    b = Math.max(b, Math.sin(Math.PI * seg(t, P_.t0 + P_.len - 0.5, P_.t0 + P_.len + 0.05)) * 7, Math.sin(Math.PI * seg(t, P_.t0 + 0.55, P_.t0 + 1.0)) * 4);
  });
  canvas.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
}

/* ---------------- camera ---------------- */
function cameraState(t) {
  let z = lerp(6.9, 6.2, eo(seg(t, 0, 12)));
  let x = Math.sin(t * 0.13) * 0.12, y = Math.sin(t * 0.11) * 0.06;
  x += Math.sin(t * 0.4) * 0.35 * seg(t, 4.5, 7) * (1 - seg(t, 10, 12.4));
  const shake = impact(t, [[MEET, 0.035], ...PANELS.map(p => [p.t0 + 0.6, 0.025])]);
  x += Math.sin(t * 91) * shake; y += Math.cos(t * 77) * shake;
  if (t > TE) { const k = 1 - seg(t, TE, TE + 1); x *= k; y *= k; }
  camera.position.set(x, y, z);
  camera.lookAt(x * 0.3, y * 0.3, 0);
  spot.intensity = lerp(0, 60, eo(seg(t, 0.2, 3))) * (1 - seg(t, 6.5, 8.5)) + 40 * seg(t, TE + 0.8, TE + 2.4);
  spot.target.position.set(0, 0.3, 0);
}

/* ---------------- grain ---------------- */
const gctx = document.getElementById('grain').getContext('2d');
const gimg = gctx.createImageData(960, 540);
function grainState(frame) {
  let s = (frame * 9301 + 49297) % 233280 || 1; const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}

/* ---------------- frame ---------------- */
function frame(t) {
  heroState(t); markState(t); pagesState(t); panelsState(t); featuresState(t); cameraState(t); typeState(t); endState(t); fxState(t);
  grainState(Math.floor(t * 24));
  renderer.render(scene, camera);
}

window.__DUR = DUR;
window.renderFrame = async t => { await seekClips(t); frame(t); return true; };

if (!RENDER) {
  let t = 0, playing = true, last = performance.now(), idleTimer;
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  const audio = new Audio('audio/soundtrack.m4a'); audio.preload = 'auto';
  scrub.max = DUR;
  const syncAudio = () => { if (Math.abs(audio.currentTime - t) > 0.15) audio.currentTime = t; };
  const setPlaying = v => { playing = v; playBtn.textContent = v ? '❚❚' : '▶'; if (v) { syncAudio(); audio.play().catch(() => {}); } else audio.pause(); PANELS.forEach(p => p.video && (v ? p.video.play().catch(() => {}) : p.video.pause())); };
  playBtn.onclick = () => setPlaying(!playing);
  scrub.oninput = () => { t = +scrub.value; syncAudio(); PANELS.forEach(p => { if (p.video) p.video.currentTime = Math.max(0, t - p.t0 - 0.5); }); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500); };
  addEventListener('pointermove', wake); wake();
  // Browsers block sound until a click: start paused with the play button showing.
  setPlaying(false);
  const loop = now => {
    if (playing) { t += Math.min(0.1, (now - last) / 1000); if (t >= DUR) { t = 0; audio.currentTime = 0; } if (!audio.paused && Math.abs(audio.currentTime - t) > 0.25) t = audio.currentTime; }
    last = now; scrub.value = t; clock.textContent = t.toFixed(1) + 's';
    frame(t); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
window.__ready = true;
</script>
